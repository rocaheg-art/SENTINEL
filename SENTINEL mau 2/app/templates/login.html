<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>SENTINEL - Acceso</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: #0d1117;
            display: flex; justify-content: center;
            align-items: center; height: 100vh; margin: 0;
            font-family: 'Segoe UI', sans-serif;
        }
        .login-box {
            background: #161b22; border: 1px solid #30363d;
            border-radius: 12px; padding: 40px; width: 380px;
        }
        .logo { text-align: center; margin-bottom: 8px; }
        .logo i { font-size: 48px; color: #58a6ff; }
        h1 { color: #58a6ff; text-align: center; font-size: 28px; font-weight: 700; letter-spacing: 3px; margin-bottom: 4px; }
        .subtitulo { text-align: center; color: #8b949e; font-size: 13px; margin-bottom: 28px; }
        label { color: #8b949e; font-size: 13px; margin-bottom: 4px; display: block; }
        input {
            width: 100%; background: #0d1117; border: 1px solid #30363d;
            color: #c9d1d9; border-radius: 6px; padding: 10px 14px;
            font-size: 14px; box-sizing: border-box; margin-bottom: 16px;
        }
        input:focus { border-color: #58a6ff; outline: none; box-shadow: 0 0 0 3px rgba(88,166,255,0.1); }
        input::placeholder { color: #484f58; }
        .btn-login {
            width: 100%; background: #238636; border: none;
            color: white; padding: 12px; border-radius: 6px;
            font-size: 15px; cursor: pointer; margin-top: 8px;
        }
        .btn-login:hover { background: #2ea043; }
        .mensaje-error {
            background: #1a0a0a; border: 1px solid #f85149;
            color: #f85149; padding: 10px 14px; border-radius: 6px; margin-bottom: 16px; font-size: 13px;
        }
        .mensaje-ok {
            background: #0a1a0a; border: 1px solid #3fb950;
            color: #3fb950; padding: 10px 14px; border-radius: 6px; margin-bottom: 16px; font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="logo"><i class="bi bi-shield-fill"></i></div>
        <h1>SENTINEL</h1>
        <p class="subtitulo">Sistema de páginas oficiales</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for categoria, mensaje in messages %}
                <div class="{% if categoria == 'error' %}mensaje-error{% else %}mensaje-ok{% endif %}">
                    {{ mensaje }}
                </div>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="/login">
            <label><i class="bi bi-envelope"></i> Correo electrónico</label>
            <input type="email" name="email" placeholder="tu@correo.com" required>

            <label><i class="bi bi-lock"></i> Contraseña</label>
            <input type="password" name="password" placeholder="••••••••" required>

            <button type="submit" class="btn-login"><i class="bi bi-box-arrow-in-right"></i> Iniciar sesión</button>
        </form>
    </div>
</body>
</html>
